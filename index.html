<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Pulse</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="stage">
      <div id="panel" hidden></div>
      <div id="character-slot">
        <div id="character" data-state="sleep">
          <div id="mascot-host"></div>
          <!-- 내장 Zzz 효과: 팩이 zzz_overlay를 켠 경우에만 JS가 표시한다 -->
          <div id="zzz" hidden aria-hidden="true"><span>z</span><span>Z</span><span>z</span></div>
        </div>
        <button id="sleep-btn" type="button" hidden>🌙 잠자기</button>
        <button id="quit-btn" type="button" hidden>✕ 종료</button>
      </div>
    </div>
  </body>
</html>
